server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  autoindex off;
  # TLS заканчивает Traefik, поэтому редирект /piter → /piter/ делаем относительным (без http://host)
  absolute_redirect off;

  # Заголовки безопасности. add_header с уровня server наследуется, только если в location нет
  # своих add_header, поэтому набор повторяется в каждом location, где задаётся Cache-Control.
  # CSP составлена по коду: скрипты, стили, шрифты, картинки, музыка — свои; наружу ходит только
  # погода (Open-Meteo) и WebSocket /live на этом же домене. Инлайн-скриптов и style="" в разметке нет
  # (стили из JS через CSSOM CSP не блокирует), data: нужен для SVG-фавикона.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' wss://lofi-goroda.ru https://api.open-meteo.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy $csp always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

  # Настоящий 404 вместо фоллбэка на index.html
  error_page 404 /404.html;

  # Скрытые файлы (.git, .env и т.п.) — не отдаём никогда
  location ~ /\. { return 404; }

  # Города — реальные папки /<id>/index.html, корень — /index.html; остального нет → 404
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  }
  # Service worker всегда проверяем заново — иначе клиенты застревают на старой версии
  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  }
  location ~* \.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  }
  # Данные городов (JSON: плейлисты, расписания, список городов): свежие, отсутствующий — 404
  location ~* \.json$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  }
  # Музыка городов: /cities/<id>/music/*.mp3 — из отдельной папки /opt/lofi-goroda/music/<id>/
  # (её заполняет deploy/sync_music.sh, в архив сайта mp3 не входят), неделю в кэше
  location ~* ^/cities/([a-z0-9-]+)/music/([^/]+\.mp3)$ {
    root /usr/share/nginx;
    try_files /music/$1/$2 =404;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  }
  # Шрифты — 30 дней, без immutable (имена файлов без хэша)
  location /fonts/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  }
  # Картинки — 7 дней
  location /img/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  }
}
