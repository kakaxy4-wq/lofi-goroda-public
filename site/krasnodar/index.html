<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Краснодар · Лофи-города</title>
<meta name="description" content="Лофи-радио Краснодара: Затон Кубани, Поцелуев мост, огни стадиона и Екатерининский собор, реальная погода и время. Бесплатно в браузере.">
<meta property="og:title" content="Краснодар · Лофи-города">
<meta property="og:description" content="Лофи-радио Краснодара: Затон Кубани, Поцелуев мост, огни стадиона и Екатерининский собор, реальная погода и время. Бесплатно в браузере.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lofi-goroda.ru/krasnodar/">
<meta property="og:image" content="https://lofi-goroda.ru/img/og-krasnodar.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://lofi-goroda.ru/krasnodar/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta property="og:locale" content="ru_RU">
<meta name="theme-color" content="#140e12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%23140e12'/><rect x='7' y='1' width='2' height='10' fill='%23e8b83a'/><rect x='5' y='11' width='6' height='4' fill='%23e8c9a4'/></svg>">
<link rel="preload" href="fonts/handjet-cyr.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pressstart-cyr.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="scene" aria-label="Санкт-Петербург: вид из окна на Неву и Петропавловскую крепость"></canvas>

<header class="hud top-left">
  <div class="brand">ЛОФИ-ГОРОДА</div>
  <h1>Санкт-Петербург</h1>
  <div class="sub"><span id="subtitle">Нева из окна мансарды</span> · <b id="clock">--:--</b> <span id="wx"></span></div>
  <button class="share-btn" id="shareBtn" type="button" data-icon="share" data-label="поделиться окном" data-tip="Поделиться окном" data-key="KeyX"></button>
  <div class="live" id="live" hidden></div>
  <div class="badge" id="timeBadge" hidden>машина времени · <button id="badgeNow">вернуться</button></div>
  <div class="badge timer" id="timerBadge" hidden></div>
</header>

<div class="tip" id="tip" hidden></div>
<div class="toast px" id="toast" hidden></div>

<div class="hud ticker" id="ticker"></div>

<footer class="dock">
  <div class="bar px">
    <button class="play" id="play" data-icon="play" aria-label="Включить эфир" data-tip="Эфир" data-key="Space"></button>
    <div class="np">
      <div class="np-title" id="npTitle">Радио Питер</div>
      <div class="np-sub" id="npSub">нажмите ▶ — эфир идёт синхронно у всех</div>
    </div>
    <div class="reacts" aria-label="Реакции">
      <button class="rb" data-react="heart" data-icon="heart" data-tip="Сердечко" data-key="Digit1"></button>
      <button class="rb" data-react="note" data-icon="note" data-tip="Нота" data-key="Digit2"></button>
      <button class="rb" data-react="star" data-icon="star" data-tip="Звезда" data-key="Digit3"></button>
      <button class="rb" data-react="moon" data-icon="moon" data-tip="Луна" data-key="Digit4"></button>
    </div>
    <div class="vols">
      <div class="vol"><button class="mute" id="muteMusic" data-icon="note" data-tip="Музыка без звука" data-key="KeyM" aria-pressed="false"></button><input type="range" id="volMusic" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость музыки"></div>
      <div class="vol"><button class="mute" id="muteCity" data-icon="city" data-tip="Город без звука" data-key="KeyC" aria-pressed="false"></button><input type="range" id="volCity" min="0" max="1" step="0.01" value="0.7" aria-label="Громкость города"></div>
    </div>
  </div>
  <div class="quick">
    <button class="qb" id="qLamp" data-icon="lamp" data-label="лампа" data-tip="Настольная лампа" data-key="KeyL"></button>
    <button class="qb" id="qGarland" data-icon="garland" data-label="гирлянда" data-tip="Гирлянда" data-key="KeyG"></button>
    <button class="qb" id="qRain" data-icon="rain" data-label="дождь" data-tip="Дождь за окном" data-key="KeyR"></button>
    <button class="qb" data-panel="timer" data-icon="timer" data-label="таймер" data-tip="Фокус и сон" data-key="KeyT"></button>
    <button class="qb" data-panel="sounds" data-icon="sound" data-label="звуки" data-tip="Звуки города" data-key="KeyS"></button>
    <button class="qb" data-panel="places" data-icon="pin" data-label="места" data-tip="Места города" data-key="KeyP"></button>
    <button class="qb" data-panel="time" data-icon="clock" data-label="время" data-tip="Время и погода" data-key="KeyW"></button>
    <button class="qb" id="fs" data-icon="full" data-label="экран" data-tip="Во весь экран" data-key="KeyF"></button>
    <button class="qb" data-panel="about" data-icon="help" data-label="о нас" data-tip="О проекте и обратная связь" data-key="KeyH"></button>
  </div>
</footer>

<aside class="panel px" id="panel" hidden>
  <div class="panel-head"><b id="panelTitle"></b><button class="x" id="panelClose" aria-label="Закрыть">×</button></div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<script type="module" src="engine/boot.js"></script>
</body>
</html>
